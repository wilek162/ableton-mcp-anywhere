[project]
name = "ableton-mcp-anywhere"
version = "1.0.1"
description = "Universal launcher for the Ableton Live MCP server: works with any agent, client, IDE or CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Pinned so the Live-side Remote Script and the tools stay version-matched.
dependencies = [
    "mcp-server-ableton-live==1.8.1",
]

[project.optional-dependencies]
http = ["uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ableton-anywhere = "ableton_anywhere.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_anywhere"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
